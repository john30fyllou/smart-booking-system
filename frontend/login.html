<!doctype html>
<html lang="el">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Σύνδεση - Smart Booking System</title>

        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <header>
            <div class="container">
                <h1>Smart Booking System</h1>

                <nav>
                    <a href="index.html">Αρχική</a>
                    <a href="login.html">Σύνδεση</a>
                    <a href="register.html">Εγγραφή</a>
                </nav>
            </div>
        </header>

        <main class="auth-page">
            <div class="auth-card">
                <h2>Σύνδεση</h2>

                <p class="auth-subtitle">Συνδέσου στον λογαριασμό σου</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>

                        <input type="email" id="email" required placeholder="example@email.com" />
                    </div>

                    <div class="form-group">
                        <label for="password">Κωδικός πρόσβασης</label>

                        <input type="password" id="password" required placeholder="••••••••" />
                    </div>

                    <button class="btn auth-btn" type="submit">Σύνδεση</button>
                </form>

                <p id="loginMessage" class="message"></p>

                <p class="auth-footer">
                    Δεν έχεις λογαριασμό;
                    <a href="register.html">Δημιούργησε έναν</a>
                </p>
            </div>
        </main>

        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
    </body>
</html>
